name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax / lint / import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Syntax check
        run: python -m py_compile bridge/*.py skill/*.py

      - name: Lint (critical rules only)
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Import smoke test
        run: |
          python -c "import sys; sys.path.insert(0, 'bridge'); import cdp, deepseek_web, llm; print('bridge modules import OK')"

      - name: CLI help
        run: python skill/ask_web.py --help
